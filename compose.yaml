services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: orgmap_migrator
      POSTGRES_PASSWORD: orgmap_local_only
      POSTGRES_DB: orgmap
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./.orgmap/postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgmap_migrator -d orgmap"]
      interval: 2s
      timeout: 3s
      retries: 30
